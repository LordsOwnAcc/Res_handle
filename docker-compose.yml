# Local dev convenience only — Render provisions its own managed Postgres via render.yaml.
# Run: docker compose up -d
# Then: cd backend && mvn spring-boot:run (Flyway migrates automatically on boot)
version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: resumeintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - resumeintel_pgdata:/var/lib/postgresql/data

volumes:
  resumeintel_pgdata:
