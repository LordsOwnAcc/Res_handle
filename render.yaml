# Render Blueprint — deploy all three pieces (Postgres, backend, frontend) together.
#
# Usage: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
#
# Note on the two envVars below (CORS_ALLOWED_ORIGINS, VITE_API_BASE_URL): Render assigns
# each service's *.onrender.com URL only once it's created, so these are hardcoded guesses
# based on the service names below (Render uses the service name as the subdomain when it's
# available). If either name was already taken in your Render account, Render will have
# appended a random suffix to that service's actual URL — check the dashboard after the
# first deploy and update these two values (then redeploy) if they don't match.
#
# fromService/fromDatabase linking is intentionally NOT used for these two — `fromService`'s
# `host` property returns Render's *private-network* hostname, which a browser (the frontend's
# JS, running on a visitor's machine) cannot reach at all. The public https:// URL has to be
# a real value, not a private-network reference.

databases:
  - name: resumeintel-db
    plan: free
    databaseName: resumeintel
    user: resumeintel

services:
  # ---- Backend: Spring Boot, deployed as a Docker web service ----
  - type: web
    name: resumeintel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PGHOST
        fromDatabase: { name: resumeintel-db, property: host }
      - key: PGPORT
        fromDatabase: { name: resumeintel-db, property: port }
      - key: PGDATABASE
        fromDatabase: { name: resumeintel-db, property: database }
      - key: PGUSER
        fromDatabase: { name: resumeintel-db, property: user }
      - key: PGPASSWORD
        fromDatabase: { name: resumeintel-db, property: password }
      - key: CORS_ALLOWED_ORIGINS
        value: https://resumeintel-frontend.onrender.com

  # ---- Frontend: Vite/React static site ----
  # No `plan` field here — Render rejects the entire Blueprint sync if a static site has one,
  # since static sites aren't billed as compute (see comment block above the databases: key).
  - type: web
    name: resumeintel-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://resumeintel-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
