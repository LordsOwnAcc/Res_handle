# Render Blueprint — deploy all three pieces (Postgres, backend, frontend) together.
#
# Usage: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
# Render reads this file and provisions everything below in one go, already wired together
# (the backend gets the Postgres connection info automatically; the frontend gets the
# backend's URL automatically).

databases:
  - name: resumeintel-db
    plan: free
    databaseName: resumeintel
    user: resumeintel

services:
  # ---- Backend: Spring Boot, deployed as a Docker web service ----
  - type: web
    name: resumeintel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PGHOST
        fromDatabase: { name: resumeintel-db, property: host }
      - key: PGPORT
        fromDatabase: { name: resumeintel-db, property: port }
      - key: PGDATABASE
        fromDatabase: { name: resumeintel-db, property: database }
      - key: PGUSER
        fromDatabase: { name: resumeintel-db, property: user }
      - key: PGPASSWORD
        fromDatabase: { name: resumeintel-db, property: password }
      # Set this to your deployed frontend's actual URL after the first deploy (Render
      # assigns the *.onrender.com URL on creation, so this is a manual edit once, or set it
      # in the Render dashboard instead of here).
      - key: CORS_ALLOWED_ORIGINS
        value: https://resumeintel-frontend.onrender.com
    healthCheckPath: /api/health

  # ---- Frontend: Vite/React static site ----
  - type: web
    name: resumeintel-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService: { name: resumeintel-backend, type: web, property: host }
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
